<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sedang Offline · SISFOR UISI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b2a4a;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 1.4rem; margin-bottom: 8px; }
      p { color: rgba(255,255,255,0.75); line-height: 1.5; }
      button {
        margin-top: 20px;
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        background: #d62828;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum tersimpan di perangkatmu. Sambungkan kembali ke internet lalu coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
